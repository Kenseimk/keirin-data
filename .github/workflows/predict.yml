name: 競輪予想 Discord投稿

on:
  schedule:
    # JST 8:00 スクレイピング (UTC 23:00前日)
    - cron: '0 23 * * *'
    # JST 8:30 予想投稿 (UTC 23:30前日)
    - cron: '30 23 * * *'
    # 当日成績レポート: JST 22:00 (UTC 13:00)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 (例: 2026-03-31)。空白で今日'
        required: false
        default: ''
      all_races:
        description: '全レース帯を投稿する (true/false)'
        required: false
        default: 'true'
      report:
        description: '当日成績レポートを投稿する (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # JST 8:00 スクレイピングのみ
    if: |
      github.event.schedule == '0 23 * * *'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリインストール
        run: pip install -r requirements.txt

      - name: 当日データをスクレイピング
        run: |
          TARGET=$(TZ=Asia/Tokyo date '+%Y-%m-%d')
          echo "スクレイピング対象: ${TARGET}"
          python scripts/scrape_day.py --date $TARGET || true

  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # JST 8:30 予想投稿、または手動でreport=false
    if: |
      github.event.schedule == '30 23 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.report != 'true')
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリインストール
        run: pip install -r requirements.txt

      - name: 当日データをスクレイピング（手動実行時のみ）
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET="${{ github.event.inputs.date }}"
          else
            TARGET=$(TZ=Asia/Tokyo date '+%Y-%m-%d')
          fi
          echo "スクレイピング対象: ${TARGET}"
          python scripts/scrape_day.py --date $TARGET || true

      - name: 予想生成 & Discord投稿
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DATE_OPT=""
          ALL_OPT="--all"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_OPT="--date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.all_races }}" = "false" ]; then
            ALL_OPT=""
          fi
          python scripts/predict_today.py $DATE_OPT $ALL_OPT

  daily_report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 当日成績レポート: JST 22:00のスケジュール、または手動でreport=true
    if: |
      github.event.schedule == '0 13 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.report == 'true')
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリインストール
        run: pip install -r requirements.txt

      - name: 当日結果をスクレイピング
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET="${{ github.event.inputs.date }}"
          else
            TARGET=$(TZ=Asia/Tokyo date '+%Y-%m-%d')
          fi
          echo "スクレイピング対象: ${TARGET}"
          python scripts/scrape_day.py --date $TARGET || true

      - name: 当日成績レポート & Discord投稿
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET="${{ github.event.inputs.date }}"
          else
            TARGET=$(TZ=Asia/Tokyo date '+%Y-%m-%d')
          fi
          python scripts/week_summary.py --from $TARGET --to $TARGET
