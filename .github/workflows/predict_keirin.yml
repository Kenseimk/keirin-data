name: keirin-predict-notify

on:
  schedule:
    # 08:00 JST (UTC 前日23:00) - 全レース一括予想
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '予想日 YYYY-MM-DD (省略=今日)'
        default: ''
        required: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージインストール
        run: pip install lightgbm numpy pandas requests beautifulsoup4 tqdm scikit-learn

      - name: 対象日決定
        id: set_params
        run: |
          python3 - << 'PYEOF'
          import os, datetime

          input_date = os.environ.get('INPUT_DATE', '').strip()
          if input_date:
              target = input_date
          else:
              # UTC→JST (+9h)
              jst = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
              target = jst.strftime('%Y-%m-%d')

          print(f'対象日: {target}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'target_date={target}\n')
          PYEOF
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}

      - name: 今日の出走データ取得
        run: |
          python scripts/scrape_day.py --date ${{ steps.set_params.outputs.target_date }}
        continue-on-error: true

      - name: 予測 & Discord通知
        run: |
          python scripts/predict_today.py \
            --date ${{ steps.set_params.outputs.target_date }} \
            --all
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: エラー時Discord通知
        if: failure()
        run: |
          python3 - << 'PYEOF'
          import requests, os
          webhook = os.environ.get('DISCORD_WEBHOOK_URL', '')
          if not webhook:
              exit(0)
          run_url = (
              'https://github.com/'
              + os.environ.get('GITHUB_REPOSITORY', '')
              + '/actions/runs/'
              + os.environ.get('GITHUB_RUN_ID', '')
          )
          requests.post(
              webhook,
              json={'content': f'🚨 競輪予測エラー: {run_url}'},
              timeout=10
          )
          PYEOF
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
